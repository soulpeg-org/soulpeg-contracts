[profile.default]
src = "contracts"
out = "out"
libs = ["node_modules", "lib"]
test = "test/foundry"
cache_path = "cache_forge"

# See more config options https://github.com/foundry-rs/foundry/tree/master/config
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200

[invariant]
runs = 256
depth = 15
fail_on_revert = false
